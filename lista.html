<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lista de Confirmados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --blush-100: #f7e4de;
    --blush-500: #cf8a75;
    --blush-700: #a85f4a;
    --blush-900: #5c3325;
    --gold: #b8935f;
    --cream: #fffaf5;
    --text-dark: #4a3c33;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    color: var(--text-dark);
    background: #f4e6d8;
    min-height: 100vh;
    padding: 32px 16px 48px;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  h1 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: 44px;
    color: var(--blush-900);
    text-align: center;
    margin: 0 0 4px;
  }

  .sub {
    text-align: center;
    font-style: italic;
    color: var(--blush-700);
    margin: 0 0 24px;
  }

  .panel {
    background: var(--cream);
    border: 1px solid rgba(232, 183, 169, 0.7);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 14px 36px rgba(92, 51, 37, 0.12);
  }

  form { display: flex; gap: 10px; }

  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 17px;
    padding: 10px 14px;
    border: 1px solid rgba(184, 147, 95, 0.5);
    border-radius: 10px;
    background: #fff;
    color: var(--text-dark);
  }

  input:focus { outline: none; border-color: var(--blush-500); box-shadow: 0 0 0 3px rgba(207, 138, 117, 0.2); }

  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--blush-500), var(--blush-700));
    cursor: pointer;
  }

  button.ghost {
    color: var(--blush-900);
    background: transparent;
    border: 1px solid rgba(184, 147, 95, 0.6);
  }

  .msg { margin: 12px 0 0; color: var(--blush-700); min-height: 1em; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat {
    background: var(--cream);
    border: 1px solid rgba(232, 183, 169, 0.7);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
  }

  .stat b {
    display: block;
    font-size: 32px;
    line-height: 1.1;
    color: var(--blush-900);
    font-variant-numeric: tabular-nums;
  }

  .stat span {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--blush-700);
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .toolbar .tools { display: flex; gap: 8px; }

  .tabs { display: flex; gap: 6px; }

  .tabs button {
    font-size: 12px;
    padding: 6px 12px;
    color: var(--blush-900);
    background: transparent;
    border: 1px solid rgba(184, 147, 95, 0.5);
  }

  .tabs button[aria-pressed="true"] { background: var(--gold); color: #fff; border-color: var(--gold); }

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 10px 2px;
    border-bottom: 1px dashed rgba(184, 147, 95, 0.4);
  }

  li:last-child { border-bottom: none; }

  .who { font-size: 18px; font-weight: 600; color: var(--blush-900); }
  .when { font-size: 13px; color: var(--blush-700); font-style: italic; }
  .qty { font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .qty.no { color: var(--blush-700); font-style: italic; }

  .empty { text-align: center; font-style: italic; color: var(--blush-700); padding: 18px 0; }

  [hidden] { display: none !important; }

  @media (max-width: 420px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .tools { justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Confirmados</h1>
  <p class="sub">Luziane &amp; Anderson</p>

  <div class="panel" id="login">
    <form id="login-form">
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" aria-label="Senha">
      <button type="submit">Entrar</button>
    </form>
    <p class="msg" id="login-msg"></p>
  </div>

  <div id="painel" hidden>
    <div class="stats">
      <div class="stat"><b id="s-pessoas">0</b><span>pessoas</span></div>
      <div class="stat"><b id="s-conf">0</b><span>confirmações</span></div>
      <div class="stat"><b id="s-nao">0</b><span>não vão</span></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="Filtro">
          <button type="button" data-f="todos" aria-pressed="true">Todos</button>
          <button type="button" data-f="vao" aria-pressed="false">Vão</button>
          <button type="button" data-f="nao" aria-pressed="false">Não vão</button>
        </div>
        <div class="tools">
          <button type="button" class="ghost" id="btn-csv">Planilha</button>
          <button type="button" class="ghost" id="btn-reload">Atualizar</button>
        </div>
      </div>
      <ul id="lista"></ul>
    </div>
  </div>
</div>

<script>
  var senha = '';
  var dados = null;
  var filtro = 'todos';

  try { senha = sessionStorage.getItem('senha-lista') || ''; } catch (e) {}

  function fmtData(iso) {
    try {
      return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  function render() {
    document.getElementById('s-pessoas').textContent = dados.totalPessoas;
    document.getElementById('s-conf').textContent = dados.confirmacoes;
    document.getElementById('s-nao').textContent = dados.naoVao;

    var ul = document.getElementById('lista');
    ul.innerHTML = '';
    var itens = dados.lista.filter(function (r) {
      return filtro === 'todos' || (filtro === 'vao' ? r.vai : !r.vai);
    });

    if (!itens.length) {
      var vazio = document.createElement('li');
      vazio.className = 'empty';
      vazio.textContent = 'Nenhuma resposta ainda.';
      ul.appendChild(vazio);
      return;
    }

    itens.forEach(function (r) {
      var li = document.createElement('li');
      var left = document.createElement('div');
      var who = document.createElement('div'); who.className = 'who'; who.textContent = r.nome;
      var when = document.createElement('div'); when.className = 'when'; when.textContent = fmtData(r.data);
      left.appendChild(who); left.appendChild(when);
      var qty = document.createElement('div');
      qty.className = 'qty' + (r.vai ? '' : ' no');
      qty.textContent = r.vai ? (r.pessoas === 1 ? '1 pessoa' : r.pessoas + ' pessoas') : 'não vai';
      li.appendChild(left); li.appendChild(qty);
      ul.appendChild(li);
    });
  }

  function carregar() {
    var msg = document.getElementById('login-msg');
    msg.textContent = 'Carregando…';
    return fetch('/api/rsvp', { headers: { 'x-senha': senha } })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) throw new Error(d.erro || 'Erro ao carregar.');
          return d;
        });
      })
      .then(function (d) {
        dados = d;
        try { sessionStorage.setItem('senha-lista', senha); } catch (e) {}
        msg.textContent = '';
        document.getElementById('login').hidden = true;
        document.getElementById('painel').hidden = false;
        render();
      })
      .catch(function (e) {
        try { sessionStorage.removeItem('senha-lista'); } catch (x) {}
        document.getElementById('login').hidden = false;
        document.getElementById('painel').hidden = true;
        msg.textContent = e.message;
      });
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    senha = document.getElementById('senha').value;
    carregar();
  });

  document.getElementById('btn-reload').addEventListener('click', carregar);

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      filtro = b.getAttribute('data-f');
      document.querySelectorAll('.tabs button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      render();
    });
  });

  // baixa um .csv que abre no Excel / Google Planilhas
  document.getElementById('btn-csv').addEventListener('click', function () {
    var linhas = [['Nome', 'Vai?', 'Pessoas', 'Respondeu em']];
    dados.lista.forEach(function (r) {
      linhas.push([r.nome, r.vai ? 'Sim' : 'Não', r.pessoas, fmtData(r.data)]);
    });
    var csv = linhas.map(function (l) {
      return l.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'confirmados.csv';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  if (senha) carregar();
</script>
</body>
</html>
